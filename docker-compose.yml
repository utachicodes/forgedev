version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forgedev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forgedev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: forgedev-redis
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forgedev-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/forgedev
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: forgedev-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules

  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: forgedev-ai
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/forgedev
    depends_on:
      - redis
      - postgres
    volumes:
      - ./apps/ai-engine:/usr/src/app

  infra-core:
    build:
      context: ./apps/infra-core
      dockerfile: Dockerfile
    container_name: forgedev-infra
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./apps/infra-core:/usr/src/app

volumes:
  postgres_data:
